<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>VoiceForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0f0e11;
  --paper: #f5f2ed;
  --warm: #ede8df;
  --rule: #d4cfc6;
  --accent: #c8522a;
  --accent2: #4a7c6f;
  --muted: #8a8479;
  --surface: #fff;
  --danger: #b84040;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'DM Mono',monospace;
  min-height:100vh;
  font-size:13px;
}

/* ── grain overlay ── */
body::after{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:999;opacity:.5;
}

/* ── layout ── */
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}

/* ── sidebar ── */
.sidebar{
  background:var(--ink);color:var(--paper);
  padding:28px 20px;
  display:flex;flex-direction:column;gap:0;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.logo{
  font-family:'DM Serif Display',serif;
  font-size:22px;letter-spacing:.02em;
  margin-bottom:4px;
}
.logo em{color:var(--accent);font-style:italic}
.tagline{font-size:10px;color:#6b6760;letter-spacing:.2em;text-transform:uppercase;margin-bottom:28px}

.section-title{
  font-size:9px;letter-spacing:.35em;text-transform:uppercase;
  color:#6b6760;margin:20px 0 10px;
  border-top:1px solid #2a2928;padding-top:16px;
}
.section-title:first-of-type{margin-top:0;border-top:none;padding-top:0}

/* api key */
.key-wrap{position:relative}
.key-input{
  width:100%;background:#1e1d1c;border:1px solid #333;
  color:var(--paper);border-radius:6px;padding:9px 36px 9px 10px;
  font-family:'DM Mono',monospace;font-size:11px;outline:none;
  transition:border-color .2s;
}
.key-input:focus{border-color:var(--accent)}
.key-input::placeholder{color:#555}
.key-eye{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:#666;cursor:pointer;font-size:13px;
  padding:2px;transition:color .2s;
}
.key-eye:hover{color:var(--paper)}
.key-status{font-size:10px;margin-top:5px;min-height:14px}
.key-status.ok{color:var(--accent2)}
.key-status.err{color:var(--danger)}

/* voices */
.voice-list{display:flex;flex-direction:column;gap:6px;flex:1}
.voice-item{
  display:flex;align-items:center;gap:8px;
  background:#1e1d1c;border:1px solid #2a2928;border-radius:6px;
  padding:8px 10px;cursor:pointer;transition:all .15s;
  position:relative;
}
.voice-item:hover{border-color:#444}
.voice-item.active{border-color:var(--accent);background:#2a1a10}
.voice-avatar{
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),#e8834a);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:500;color:white;flex-shrink:0;
  font-family:'DM Serif Display',serif;
}
.voice-info{flex:1;min-width:0}
.voice-name{font-size:11px;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.voice-meta{font-size:9px;color:#555;margin-top:1px}
.voice-del{
  background:none;border:none;color:#444;cursor:pointer;
  font-size:12px;padding:2px 4px;transition:color .15s;flex-shrink:0;
}
.voice-del:hover{color:var(--danger)}
.voice-add{
  display:flex;align-items:center;justify-content:center;gap:6px;
  background:transparent;border:1px dashed #333;border-radius:6px;
  color:#666;padding:8px;cursor:pointer;font-family:'DM Mono',monospace;
  font-size:11px;transition:all .15s;width:100%;
}
.voice-add:hover{border-color:#666;color:var(--paper)}
.empty-voices{
  text-align:center;color:#555;font-size:11px;padding:20px 0;line-height:1.8;
}

/* ── main area ── */
.main{padding:36px 40px;max-width:740px}
.page-header{margin-bottom:32px}
.page-title{font-family:'DM Serif Display',serif;font-size:32px;font-weight:400;line-height:1.1}
.page-title em{color:var(--accent);font-style:italic}
.page-sub{color:var(--muted);font-size:11px;margin-top:6px;letter-spacing:.05em}

/* cards */
.card{
  background:var(--surface);border:1px solid var(--rule);
  border-radius:10px;padding:22px 24px;margin-bottom:16px;
}
.card-head{
  font-size:9px;letter-spacing:.35em;text-transform:uppercase;
  color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px;
}
.card-head::after{content:'';flex:1;height:1px;background:var(--rule)}

/* textarea */
textarea{
  width:100%;background:var(--warm);border:1px solid var(--rule);
  color:var(--ink);border-radius:7px;padding:14px 16px;
  font-family:'DM Mono',monospace;font-size:13px;line-height:1.8;
  resize:vertical;min-height:120px;outline:none;
  transition:border-color .2s;
}
textarea:focus{border-color:var(--accent)}
textarea::placeholder{color:var(--muted)}
.meta-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.char-count{font-size:10px;color:var(--muted)}

/* options */
.opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:4px}
.opt-group label{
  display:block;font-size:9px;letter-spacing:.25em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px;
}
select{
  width:100%;background:var(--warm);border:1px solid var(--rule);
  color:var(--ink);border-radius:6px;padding:8px 10px;
  font-family:'DM Mono',monospace;font-size:11px;outline:none;
  transition:border-color .2s;cursor:pointer;
}
select:focus{border-color:var(--accent)}
.speed-val{color:var(--accent);font-weight:500}
input[type=range]{
  width:100%;-webkit-appearance:none;height:2px;
  background:var(--rule);border-radius:1px;cursor:pointer;margin-top:10px;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:var(--accent);cursor:pointer;
}
.range-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:4px}

/* generate btn */
.btn-gen{
  width:100%;padding:14px;
  background:var(--ink);color:var(--paper);
  border:none;border-radius:8px;
  font-family:'DM Mono',monospace;font-size:13px;font-weight:500;
  letter-spacing:.08em;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-gen:hover:not(:disabled){background:#2a2826;transform:translateY(-1px)}
.btn-gen:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-gen.loading{pointer-events:none}

/* progress */
.progress{margin-top:12px;display:none}
.progress.show{display:block}
.progress-track{height:2px;background:var(--rule);border-radius:1px;overflow:hidden}
.progress-fill{
  height:100%;background:linear-gradient(90deg,var(--accent),#e8834a);
  border-radius:1px;width:0%;transition:width .4s;
}
.progress-label{font-size:10px;color:var(--muted);margin-top:6px;text-align:center}

/* output */
.output{display:none;margin-top:16px}
.output.show{display:block}
.player{
  background:var(--warm);border:1px solid var(--rule);
  border-radius:8px;padding:16px 20px;
  display:flex;align-items:center;gap:14px;
}
.play-btn{
  width:40px;height:40px;border-radius:50%;
  background:var(--ink);color:var(--paper);
  border:none;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;flex-shrink:0;font-size:14px;
}
.play-btn:hover{background:var(--accent)}
.player-track{flex:1}
.player-title{font-size:11px;color:var(--ink);margin-bottom:8px}
.prog-wrap{height:2px;background:var(--rule);border-radius:1px;cursor:pointer;position:relative}
.prog-fill{height:100%;background:var(--accent);border-radius:1px;width:0%;transition:width .1s}
.player-time{font-size:10px;color:var(--muted);margin-top:5px}
.btn-dl{
  background:transparent;border:1px solid var(--rule);color:var(--ink);
  padding:8px 14px;border-radius:6px;cursor:pointer;
  font-family:'DM Mono',monospace;font-size:10px;
  transition:all .15s;white-space:nowrap;flex-shrink:0;
}
.btn-dl:hover{border-color:var(--ink)}

/* modal */
.modal-bg{
  position:fixed;inset:0;background:rgba(15,14,17,.6);
  backdrop-filter:blur(4px);z-index:100;display:none;
  align-items:center;justify-content:center;
}
.modal-bg.show{display:flex}
.modal{
  background:var(--surface);border:1px solid var(--rule);
  border-radius:12px;padding:28px;width:440px;max-width:90vw;
}
.modal-title{font-family:'DM Serif Display',serif;font-size:20px;margin-bottom:6px}
.modal-sub{font-size:11px;color:var(--muted);margin-bottom:20px;line-height:1.6}
.field{margin-bottom:14px}
.field label{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input[type=text]{
  width:100%;background:var(--warm);border:1px solid var(--rule);
  color:var(--ink);border-radius:6px;padding:9px 12px;
  font-family:'DM Mono',monospace;font-size:12px;outline:none;
  transition:border-color .2s;
}
.field input[type=text]:focus{border-color:var(--accent)}

/* upload zone */
.upload-zone{
  border:1.5px dashed var(--rule);border-radius:8px;
  padding:28px 20px;text-align:center;cursor:pointer;
  transition:all .2s;position:relative;margin-bottom:12px;
}
.upload-zone:hover,.upload-zone.drag{border-color:var(--accent);background:rgba(200,82,42,.04)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.upload-icon{font-size:28px;margin-bottom:8px;display:block}
.upload-text{font-size:11px;color:var(--muted);line-height:1.7}
.upload-text strong{color:var(--accent)}

/* record btn */
.rec-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.btn-rec{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  background:transparent;border:1px solid var(--rule);color:var(--ink);
  padding:9px;border-radius:6px;cursor:pointer;
  font-family:'DM Mono',monospace;font-size:11px;transition:all .15s;
}
.btn-rec:hover{border-color:var(--ink)}
.btn-rec.rec{border-color:var(--danger);color:var(--danger)}
.rec-dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.btn-rec.rec .rec-dot{animation:blink .8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* noise reduction toggle */
.noise-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;background:var(--warm);border:1px solid var(--rule);
  border-radius:6px;margin-bottom:12px;
}
.noise-label{font-size:11px;color:var(--ink)}
.noise-sub{font-size:9px;color:var(--muted);margin-top:2px}
.toggle{
  position:relative;width:36px;height:20px;flex-shrink:0;
}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{
  position:absolute;inset:0;background:var(--rule);border-radius:10px;
  cursor:pointer;transition:.2s;
}
.toggle-slider::before{
  content:'';position:absolute;width:14px;height:14px;
  left:3px;top:3px;background:white;border-radius:50%;transition:.2s;
}
.toggle input:checked+.toggle-slider{background:var(--accent2)}
.toggle input:checked+.toggle-slider::before{transform:translateX(16px)}

/* preview strip */
.preview-strip{
  display:none;align-items:center;gap:10px;
  padding:10px 14px;background:var(--warm);border:1px solid var(--rule);
  border-radius:6px;margin-bottom:12px;
}
.preview-strip.show{display:flex}
.preview-wave{display:flex;align-items:center;gap:2px;height:20px}
.preview-wave span{
  display:block;width:3px;border-radius:2px;background:var(--accent2);
  animation:wv 1s ease-in-out infinite;
}
.preview-wave span:nth-child(2){animation-delay:.15s}
.preview-wave span:nth-child(3){animation-delay:.3s}
.preview-wave span:nth-child(4){animation-delay:.45s}
.preview-wave span:nth-child(5){animation-delay:.6s}
@keyframes wv{0%,100%{height:4px}50%{height:16px}}
.preview-name{flex:1;font-size:11px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-size{font-size:10px;color:var(--muted)}
.preview-del{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px 6px;transition:color .15s}
.preview-del:hover{color:var(--danger)}

/* modal buttons */
.modal-btns{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.btn-cancel{
  background:transparent;border:1px solid var(--rule);color:var(--muted);
  padding:9px 18px;border-radius:6px;cursor:pointer;
  font-family:'DM Mono',monospace;font-size:12px;transition:all .15s;
}
.btn-cancel:hover{border-color:var(--muted);color:var(--ink)}
.btn-save{
  background:var(--ink);color:var(--paper);border:none;
  padding:9px 20px;border-radius:6px;cursor:pointer;
  font-family:'DM Mono',monospace;font-size:12px;transition:all .15s;
}
.btn-save:hover{background:var(--accent)}
.btn-save:disabled{opacity:.4;cursor:not-allowed}

/* toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);
  background:var(--ink);color:var(--paper);padding:10px 20px;
  border-radius:8px;font-size:12px;z-index:200;
  transition:transform .25s;pointer-events:none;
}
.toast.ok{background:#2a4a3e}
.toast.err{background:#4a2020}
.toast.show{transform:translateX(-50%) translateY(0)}

/* noise processing overlay */
.noise-overlay{
  position:absolute;inset:0;background:rgba(245,242,237,.85);
  border-radius:6px;display:none;align-items:center;justify-content:center;
  gap:8px;font-size:11px;color:var(--muted);flex-direction:column;z-index:10;
}
.noise-overlay.show{display:flex}
.noise-spinner{
  width:20px;height:20px;border:2px solid var(--rule);
  border-top-color:var(--accent2);border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:700px){
  .app{grid-template-columns:1fr}
  .sidebar{position:relative;height:auto}
  .main{padding:20px}
  .opts{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="logo">Voice<em>Forge</em></div>
    <div class="tagline">声音克隆 · 文字转语音</div>

    <div class="section-title">API Key</div>
    <div class="key-wrap">
      <input class="key-input" type="password" id="apiKey"
        placeholder="sk-xxxxxxxxxxxxxxxx" oninput="onKeyInput()">
      <button class="key-eye" onclick="toggleKey()" id="keyEye">👁</button>
    </div>
    <div class="key-status" id="keyStatus"></div>

    <div class="section-title">声音样本库</div>
    <div class="voice-list" id="voiceList"></div>
    <button class="voice-add" onclick="openModal()" style="margin-top:8px">
      + 添加声音样本
    </button>
  </aside>

  <!-- ── Main ── -->
  <main class="main">
    <div class="page-header">
      <h1 class="page-title">声音<em>克隆</em>工作台</h1>
      <p class="page-sub">上传或录制声音样本 · 输入文字 · 一键生成克隆语音</p>
    </div>

    <!-- Text input -->
    <div class="card">
      <div class="card-head">输入文字</div>
      <textarea id="textInput" maxlength="500"
        placeholder="输入要克隆朗读的文字内容...&#10;&#10;示例：大家好，这是我的声音克隆测试。"></textarea>
      <div class="meta-row">
        <span class="char-count"><span id="charCount">0</span> / 500</span>
      </div>
    </div>

    <!-- Options -->
    <div class="card">
      <div class="card-head">合成参数</div>
      <div class="opts">
        <div class="opt-group">
          <label>语言</label>
          <select id="langSel">
            <option value="zh-cn">中文</option>
            <option value="en">英语</option>
            <option value="ja">日语</option>
            <option value="ko">韩语</option>
            <option value="fr">法语</option>
            <option value="es">西班牙语</option>
            <option value="de">德语</option>
          </select>
        </div>
        <div class="opt-group">
          <label>语速 · <span class="speed-val" id="speedVal">1.0</span>x</label>
          <input type="range" id="speedRange" min="0.5" max="2" step="0.1" value="1"
            oninput="document.getElementById('speedVal').textContent=parseFloat(this.value).toFixed(1)">
          <div class="range-labels"><span>0.5×</span><span>2.0×</span></div>
        </div>
        <div class="opt-group">
          <label>音质模式</label>
          <select id="latencySel">
            <option value="normal">标准（推荐）</option>
            <option value="balanced">均衡</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Generate -->
    <button class="btn-gen" id="genBtn" onclick="generate()" disabled>
      <span id="genIcon">⚡</span>
      <span id="genLabel">选择声音样本后生成</span>
    </button>

    <div class="progress" id="progress">
      <div class="progress-track"><div class="progress-fill" id="pFill"></div></div>
      <div class="progress-label" id="pLabel">正在合成...</div>
    </div>

    <div class="output" id="output">
      <div class="card" style="margin-top:0">
        <div class="card-head">合成结果</div>
        <div class="player">
          <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
          <div class="player-track">
            <div class="player-title" id="playerTitle">—</div>
            <div class="prog-wrap" id="progWrap" onclick="seekAudio(event)">
              <div class="prog-fill" id="progFill"></div>
            </div>
            <div class="player-time" id="playerTime">0:00 / 0:00</div>
          </div>
          <button class="btn-dl" onclick="downloadAudio()">↓ 下载</button>
        </div>
        <audio id="audioEl" style="display:none"></audio>
      </div>
    </div>
  </main>
</div>

<!-- ── Add Voice Modal ── -->
<div class="modal-bg" id="modalBg" onclick="closeModalBg(event)">
  <div class="modal">
    <div class="modal-title">添加声音样本</div>
    <div class="modal-sub">上传音频文件或实时录音。<br>建议 15–30 秒清晰人声，效果更佳。</div>

    <div class="field">
      <label>声音名称</label>
      <input type="text" id="voiceName" placeholder="例如：主播甲、旁白男声…" maxlength="20">
    </div>

    <!-- noise reduction toggle -->
    <div class="noise-row">
      <div>
        <div class="noise-label">🎙 背景降噪</div>
        <div class="noise-sub">自动去除背景噪音，提升克隆质量</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="noiseToggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <!-- upload zone -->
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept="audio/*" onchange="onFileSelect(event)">
      <span class="upload-icon">🎵</span>
      <div class="upload-text">
        <strong>点击上传</strong> 或拖拽音频文件<br>
        支持 WAV · MP3 · M4A · FLAC
      </div>
    </div>

    <!-- record -->
    <div class="rec-row">
      <span style="font-size:10px;color:var(--muted)">— 或 —</span>
      <button class="btn-rec" id="recBtn" onclick="toggleRec()">
        <span class="rec-dot"></span>
        <span id="recLabel">实时录音</span>
      </button>
    </div>

    <!-- preview -->
    <div class="preview-strip" id="previewStrip" style="position:relative">
      <div class="preview-wave">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <span class="preview-name" id="previewName">—</span>
      <span class="preview-size" id="previewSize">—</span>
      <button class="preview-del" onclick="clearAudio()">✕</button>
      <div class="noise-overlay" id="noiseOverlay">
        <div class="noise-spinner"></div>
        <span>降噪处理中…</span>
      </div>
    </div>

    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save" id="saveBtn" onclick="saveVoice()" disabled>保存声音</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
const DB_KEY   = 'voiceforge_voices';
const API_KEY  = 'voiceforge_apikey';
const API_BASE = 'https://api.fish.audio';

let voices      = [];   // [{id, name, audioB64, mime, size, created}]
let activeVoice = null; // id
let pendingBlob = null; // File/Blob being added
let mediaRec    = null;
let recChunks   = [];
let isRecording = false;
let currentAudioURL = null;

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
function init() {
  // restore API key
  const k = localStorage.getItem(API_KEY) || '';
  document.getElementById('apiKey').value = k;
  if (k) validateKeyUI(k);

  // restore voices
  try { voices = JSON.parse(localStorage.getItem(DB_KEY) || '[]'); } catch { voices = []; }
  renderVoices();

  // text counter
  document.getElementById('textInput').addEventListener('input', () => {
    document.getElementById('charCount').textContent =
      document.getElementById('textInput').value.length;
    checkReady();
  });

  // upload zone drag
  const uz = document.getElementById('uploadZone');
  uz.addEventListener('dragover',  e => { e.preventDefault(); uz.classList.add('drag'); });
  uz.addEventListener('dragleave', () => uz.classList.remove('drag'));
  uz.addEventListener('drop', e => {
    e.preventDefault(); uz.classList.remove('drag');
    const f = e.dataTransfer.files[0];
    if (f) handleFile(f);
  });
}

// ══════════════════════════════════════════
//  API KEY
// ══════════════════════════════════════════
function onKeyInput() {
  const k = document.getElementById('apiKey').value.trim();
  localStorage.setItem(API_KEY, k);
  validateKeyUI(k);
  checkReady();
}
function validateKeyUI(k) {
  const el = document.getElementById('keyStatus');
  if (!k)          { el.textContent=''; el.className='key-status'; return; }
  if (k.length>=20){ el.textContent='✓ 已保存'; el.className='key-status ok'; }
  else             { el.textContent='格式可能有误'; el.className='key-status err'; }
}
function toggleKey() {
  const el = document.getElementById('apiKey');
  el.type = el.type === 'password' ? 'text' : 'password';
}

// ══════════════════════════════════════════
//  VOICE LIBRARY
// ══════════════════════════════════════════
function saveVoices() {
  localStorage.setItem(DB_KEY, JSON.stringify(voices));
}

function renderVoices() {
  const list = document.getElementById('voiceList');
  if (!voices.length) {
    list.innerHTML = '<div class="empty-voices">暂无声音样本<br>点击下方按钮添加</div>';
    activeVoice = null; checkReady(); return;
  }
  list.innerHTML = voices.map(v => `
    <div class="voice-item${v.id===activeVoice?' active':''}" onclick="selectVoice('${v.id}')">
      <div class="voice-avatar">${v.name.charAt(0)}</div>
      <div class="voice-info">
        <div class="voice-name">${escHtml(v.name)}</div>
        <div class="voice-meta">${v.size} · ${v.created}</div>
      </div>
      <button class="voice-del" onclick="deleteVoice(event,'${v.id}')" title="删除">✕</button>
    </div>
  `).join('');
  checkReady();
}

function selectVoice(id) {
  activeVoice = id;
  renderVoices();
  checkReady();
}

function deleteVoice(e, id) {
  e.stopPropagation();
  voices = voices.filter(v => v.id !== id);
  if (activeVoice === id) activeVoice = voices[0]?.id || null;
  saveVoices(); renderVoices();
  toast('声音样本已删除');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ══════════════════════════════════════════
//  ADD VOICE MODAL
// ══════════════════════════════════════════
function openModal() {
  pendingBlob = null;
  document.getElementById('voiceName').value = '';
  document.getElementById('saveBtn').disabled = true;
  document.getElementById('previewStrip').classList.remove('show');
  document.getElementById('recBtn').classList.remove('rec');
  document.getElementById('recLabel').textContent = '实时录音';
  if (isRecording) stopRec();
  document.getElementById('modalBg').classList.add('show');
}
function closeModal() {
  document.getElementById('modalBg').classList.remove('show');
  if (isRecording) stopRec();
  pendingBlob = null;
}
function closeModalBg(e) {
  if (e.target === document.getElementById('modalBg')) closeModal();
}

// ── file upload ──
function onFileSelect(e) {
  const f = e.target.files[0];
  if (f) handleFile(f);
  e.target.value = '';
}

async function handleFile(file) {
  const denoise = document.getElementById('noiseToggle').checked;
  if (denoise) {
    showNoiseOverlay(true);
    try {
      pendingBlob = await denoiseAudio(file);
    } catch {
      pendingBlob = file; // fallback to original
    }
    showNoiseOverlay(false);
  } else {
    pendingBlob = file;
  }
  showPreview(pendingBlob.name || file.name, pendingBlob.size);
}

function showNoiseOverlay(show) {
  document.getElementById('noiseOverlay').classList.toggle('show', show);
  document.getElementById('previewStrip').classList.add('show');
}

function showPreview(name, size) {
  document.getElementById('previewName').textContent = name;
  document.getElementById('previewSize').textContent = fmtSize(size);
  document.getElementById('previewStrip').classList.add('show');
  checkSaveReady();
}

function clearAudio() {
  pendingBlob = null;
  document.getElementById('previewStrip').classList.remove('show');
  checkSaveReady();
}

function checkSaveReady() {
  const ok = !!pendingBlob && document.getElementById('voiceName').value.trim().length > 0;
  document.getElementById('saveBtn').disabled = !ok;
}
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('voiceName').addEventListener('input', checkSaveReady);
});

// ── save voice ──
async function saveVoice() {
  const name = document.getElementById('voiceName').value.trim();
  if (!name || !pendingBlob) return;

  const b64 = await blobToB64(pendingBlob);
  const id  = 'v_' + Date.now();
  voices.push({
    id, name,
    audioB64: b64,
    mime: pendingBlob.type || 'audio/wav',
    size: fmtSize(pendingBlob.size),
    created: new Date().toLocaleDateString('zh-CN'),
  });
  activeVoice = id;
  saveVoices(); renderVoices();
  closeModal();
  toast('✓ 声音样本已保存', 'ok');
}

// ══════════════════════════════════════════
//  RECORDING
// ══════════════════════════════════════════
async function toggleRec() {
  if (!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recChunks = [];
      mediaRec  = new MediaRecorder(stream);
      mediaRec.ondataavailable = e => recChunks.push(e.data);
      mediaRec.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(recChunks, { type: 'audio/webm' });
        await handleFile(new File([blob], '录音.webm', { type: 'audio/webm' }));
      };
      mediaRec.start();
      isRecording = true;
      document.getElementById('recBtn').classList.add('rec');
      document.getElementById('recLabel').textContent = '停止录音';
    } catch { toast('⚠ 无法访问麦克风', 'err'); }
  } else { stopRec(); }
}

function stopRec() {
  mediaRec?.stop();
  isRecording = false;
  document.getElementById('recBtn').classList.remove('rec');
  document.getElementById('recLabel').textContent = '实时录音';
}

// ══════════════════════════════════════════
//  NOISE REDUCTION (Web Audio API)
// ══════════════════════════════════════════
async function denoiseAudio(file) {
  /**
   * 浏览器端轻量降噪：
   * 使用 Web Audio API 的 DynamicsCompressorNode + 高通滤波器
   * 去除低频隆隆声和轻微背景噪音。
   * 注意：这是轻量级处理，不如专业降噪软件，但对大多数场景有效。
   */
  const ctx   = new (window.AudioContext || window.webkitAudioContext)();
  const arrBuf = await file.arrayBuffer();
  const audioBuf = await ctx.decodeAudioData(arrBuf);

  const offCtx = new OfflineAudioContext(
    audioBuf.numberOfChannels,
    audioBuf.length,
    audioBuf.sampleRate
  );

  const src = offCtx.createBufferSource();
  src.buffer = audioBuf;

  // 高通滤波：去除 80Hz 以下的低频噪声（空调、风声等）
  const hpf = offCtx.createBiquadFilter();
  hpf.type      = 'highpass';
  hpf.frequency.value = 80;

  // 动态压缩：减少音量突变、压制背景噪音
  const comp = offCtx.createDynamicsCompressor();
  comp.threshold.value = -40;
  comp.knee.value      = 10;
  comp.ratio.value     = 4;
  comp.attack.value    = 0.003;
  comp.release.value   = 0.1;

  // 增益：补偿压缩后的音量损失
  const gain = offCtx.createGain();
  gain.gain.value = 1.3;

  src.connect(hpf);
  hpf.connect(comp);
  comp.connect(gain);
  gain.connect(offCtx.destination);
  src.start(0);

  const rendered = await offCtx.startRendering();
  await ctx.close();

  // 转成 WAV Blob
  return audioBufferToWavBlob(rendered);
}

function audioBufferToWavBlob(buffer) {
  const numCh   = buffer.numberOfChannels;
  const sr      = buffer.sampleRate;
  const len     = buffer.length;
  const arrBuf  = new ArrayBuffer(44 + len * numCh * 2);
  const view    = new DataView(arrBuf);

  function writeStr(off, str) {
    for (let i=0;i<str.length;i++) view.setUint8(off+i, str.charCodeAt(i));
  }
  function floatTo16(f) { return Math.max(-1,Math.min(1,f)) * 0x7FFF | 0; }

  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + len*numCh*2, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numCh, true);
  view.setUint32(24, sr, true);
  view.setUint32(28, sr * numCh * 2, true);
  view.setUint16(32, numCh * 2, true);
  view.setUint16(34, 16, true);
  writeStr(36, 'data');
  view.setUint32(40, len * numCh * 2, true);

  let off = 44;
  for (let i=0; i<len; i++) {
    for (let ch=0; ch<numCh; ch++) {
      view.setInt16(off, floatTo16(buffer.getChannelData(ch)[i]), true);
      off += 2;
    }
  }
  return new Blob([arrBuf], { type: 'audio/wav' });
}

// ══════════════════════════════════════════
//  GENERATE
// ══════════════════════════════════════════
function checkReady() {
  const key  = document.getElementById('apiKey').value.trim();
  const text = document.getElementById('textInput').value.trim();
  const ok   = key.length >= 20 && text.length > 0 && !!activeVoice;
  const btn  = document.getElementById('genBtn');
  btn.disabled = !ok;
  document.getElementById('genLabel').textContent =
    !key.length    ? '请先填写 API Key' :
    !activeVoice   ? '请先选择声音样本' :
    !text.length   ? '请输入文字内容'   : '生成语音';
}

async function generate() {
  const key  = document.getElementById('apiKey').value.trim();
  const text = document.getElementById('textInput').value.trim();
  const lang = document.getElementById('langSel').value;
  const spd  = parseFloat(document.getElementById('speedRange').value);
  const latency = document.getElementById('latencySel').value;
  const voice = voices.find(v => v.id === activeVoice);
  if (!voice) return;

  // UI: loading
  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  btn.querySelector('#genIcon').textContent = '⏳';
  btn.querySelector('#genLabel').textContent = '合成中…';
  document.getElementById('progress').classList.add('show');
  document.getElementById('output').classList.remove('show');

  const steps = [
    [15, '准备声音样本…'],
    [40, '调用 Fish Audio API…'],
    [70, '生成音频波形…'],
    [90, '后处理中…'],
  ];
  let si = 0;
  const iv = setInterval(() => {
    if (si < steps.length) {
      document.getElementById('pFill').style.width  = steps[si][0] + '%';
      document.getElementById('pLabel').textContent = steps[si][1];
      si++;
    }
  }, 1000);

  try {
    // decode base64 audio → Uint8Array
    const audioBytes = b64ToUint8(voice.audioB64);

    // build multipart/form-data manually (Fish Audio REST API)
    const formData = new FormData();

    // TTS request JSON part
    const reqJson = JSON.stringify({
      text,
      references: [],   // audio sent as separate part
      format: 'wav',
      latency,
      ...(spd !== 1.0 ? { prosody: { speed: spd } } : {}),
    });
    formData.append('message', new Blob([reqJson], { type: 'application/json' }));

    // Reference audio part
    const audioBlob = new Blob([audioBytes], { type: voice.mime || 'audio/wav' });
    formData.append('references', audioBlob, 'ref.wav');
    // reference text (empty — Fish Audio can infer)
    formData.append('references_text', '');

    const resp = await fetch(`${API_BASE}/v1/tts`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${key}` },
      body: formData,
    });

    clearInterval(iv);

    if (!resp.ok) {
      const errText = await resp.text();
      let msg = `HTTP ${resp.status}`;
      try { msg = JSON.parse(errText).message || msg; } catch {}
      if (resp.status === 402) msg = '余额不足，请前往 fish.audio 充值';
      if (resp.status === 401) msg = 'API Key 无效，请检查';
      throw new Error(msg);
    }

    const audioData = await resp.arrayBuffer();
    document.getElementById('pFill').style.width  = '100%';
    document.getElementById('pLabel').textContent = '✓ 合成完成！';

    // setup player
    const url = URL.createObjectURL(new Blob([audioData], { type: 'audio/wav' }));
    currentAudioURL = url;
    setupPlayer(url, voice.name);

    setTimeout(() => {
      document.getElementById('progress').classList.remove('show');
      document.getElementById('output').classList.add('show');
      document.getElementById('output').scrollIntoView({ behavior: 'smooth' });
      toast('✓ 声音生成成功！', 'ok');
    }, 400);

  } catch (err) {
    clearInterval(iv);
    document.getElementById('progress').classList.remove('show');
    toast('✕ ' + err.message, 'err');
  } finally {
    btn.disabled = false;
    btn.querySelector('#genIcon').textContent = '⚡';
    btn.querySelector('#genLabel').textContent = '生成语音';
    checkReady();
  }
}

// ══════════════════════════════════════════
//  PLAYER
// ══════════════════════════════════════════
function setupPlayer(url, name) {
  const audio = document.getElementById('audioEl');
  audio.src   = url;
  document.getElementById('playerTitle').textContent = name + ' · 合成完成';

  audio.ontimeupdate = () => {
    const pct = audio.duration ? audio.currentTime/audio.duration*100 : 0;
    document.getElementById('progFill').style.width = pct + '%';
    document.getElementById('playerTime').textContent =
      fmt(audio.currentTime) + ' / ' + fmt(audio.duration||0);
  };
  audio.onended = () => {
    document.getElementById('playBtn').textContent = '▶';
  };
}
function togglePlay() {
  const a = document.getElementById('audioEl');
  const b = document.getElementById('playBtn');
  if (a.paused) { a.play(); b.textContent = '⏸'; }
  else          { a.pause(); b.textContent = '▶'; }
}
function seekAudio(e) {
  const a = document.getElementById('audioEl');
  const r = document.getElementById('progWrap').getBoundingClientRect();
  a.currentTime = ((e.clientX - r.left) / r.width) * (a.duration || 0);
}
function downloadAudio() {
  if (!currentAudioURL) return;
  const a = document.createElement('a');
  a.href = currentAudioURL;
  a.download = 'voiceforge_' + Date.now() + '.wav';
  a.click();
}
function fmt(s) {
  if (!s || isNaN(s)) return '0:00';
  return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
}

// ══════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════
function fmtSize(b) {
  return b > 1024*1024 ? (b/1024/1024).toFixed(1)+'MB' : Math.round(b/1024)+'KB';
}
function blobToB64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload  = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}
function b64ToUint8(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i=0; i<bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = `toast${type?' '+type:''} show`;
  setTimeout(() => t.className = `toast${type?' '+type:''}`, 3000);
}

init();
</script>
